services:
  - type: web
    name: chaintickts-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA rewrite — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CONTRACT_ADDRESS
        sync: false   # Set this in Render dashboard — never hardcode
      - key: VITE_CHAIN_ID
        value: "11155111"
      - key: VITE_SUPPORTED_CHAIN_IDS
        value: "31337,11155111"
